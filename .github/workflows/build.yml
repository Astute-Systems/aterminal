name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['22.04', '24.04', '26.04']
    container: ubuntu:${{ matrix.version }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake dpkg-dev file git libsdl2-dev
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cd build
          cpack -G DEB
          # Each release needs its own name, as the libraries differ between them.
          for package in *.deb; do mv "$package" "${package%.deb}_ubuntu-${{ matrix.version }}.deb"; done
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-${{ matrix.version }}
          path: build/*.deb
          if-no-files-found: error

  almalinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['9', '10']
    container: almalinux:${{ matrix.version }}
    steps:
      - name: Install dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y gcc-c++ cmake make rpm-build git
          if [ "${{ matrix.version }}" = 9 ]; then
              dnf install -y SDL2-devel
          else
              # AlmaLinux 10 keeps the SDL2 headers in its separate devel repository.
              dnf install -y --repofrompath=alma-devel,https://repo.almalinux.org/almalinux/10/devel/x86_64/os/ \
                  --setopt=alma-devel.gpgcheck=1 --setopt=alma-devel.gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10 \
                  sdl2-compat-devel
          fi
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack -G RPM
      - uses: actions/upload-artifact@v7
        with:
          name: almalinux-${{ matrix.version }}
          path: build/*.rpm
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake sdl2-compat
      - uses: actions/checkout@v7
      - name: Build, test and package
        run: |
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder .
          su builder -c 'cd packaging/arch && makepkg --noconfirm'
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      # SDL's own allocations would dominate a leak report.
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake git libsdl2-dev
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer'
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  snap-publish:
    # Pushes to main go to the edge channel, and version tags go to stable.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [ubuntu, almalinux, arch, sanitizers, snap]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(cat VERSION)" ]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)" >&2
              exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: snap
          path: snap-artifact
      - name: Find the snap
        id: snap
        run: echo "path=$(ls snap-artifact/*.snap)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, almalinux, arch, sanitizers, snap]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches VERSION
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(cat VERSION)" ]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)" >&2
              exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Add checksums
        run: cd artifacts && sha256sum * > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
              gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
          fi
